name: Update Cloudflare Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    name: Refresh Cloudflare Statistics
    timeout-minutes: 5
    
    steps:
      - name: Fetch and cache Cloudflare stats
        run: |
          DATE_UTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          DATE_WAW=$(TZ=Europe/Warsaw date +"%Y-%m-%d %H:%M:%S %Z")
          echo "🕒 Started: $DATE_UTC (Poland Time: $DATE_WAW)"
          
          echo "🌐 Refreshing https://dav.one/cloudflare-stats.json..."
          
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" https://dav.one/cloudflare-stats.json)
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Success! Endpoint returned HTTP $HTTP_STATUS."
          else
            echo "❌ Error! Endpoint returned HTTP $HTTP_STATUS."
            exit 1
          fi
          
          END_DATE_UTC=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          END_DATE_WAW=$(TZ=Europe/Warsaw date +"%Y-%m-%d %H:%M:%S %Z")
          echo "🏁 Finished: $END_DATE_UTC (Poland Time: $END_DATE_WAW)"
